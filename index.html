<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANDANOMIAL TUTORING | Elite Academic Mentorship</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.93);
            --primary: #1e1b4b;
            --accent: #2563eb;
            --text-dark: #1f2937;
            --text-light: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Fullscreen Animated Background Slideshow */
        .bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1);
            filter: saturate(1.15) brightness(1.18);
            transition: opacity 0.8s ease-in-out, transform 3s ease-out;
        }

        .bg-slide.active {
            opacity: 1;
            transform: scale(1.05);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.35) 0%, rgba(30, 41, 59, 0.30) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* Hero Section Styling with Logo */
        header {
            text-align: center;
            padding: 5rem 1.5rem 4rem; /* Reduced top padding slightly for logo balance */
            color: #ffffff;
            clip-path: ellipse(160% 100% at 50% 0%);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-bottom: 6px solid #fbbf24;
            position: relative;
            /* Add a dark background to make logo stand out against the slideshow */
            background: #0f172a; 
        }

        /* Logo Container inside header */
        .header-logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
            position: relative;
            z-index: 3;
        }

        .header-logo-container img {
            max-width: 400px; /* Adjust size as needed */
            height: auto;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
            border-radius: 20px; /* Match the artistic border of the input */
        }

        header .badge {
            background-color: #fbbf24;
            color: #0f172a;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            padding: 0.6rem 1.75rem;
            border-radius: 50px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: clamp(3.8rem, 8.5vw, 7.5rem);
            margin-bottom: 0.25rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            line-height: 1.1;
        }

        header h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.3rem;
            margin-bottom: 1rem;
            font-weight: 600;
            color: #93c5fd;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        header p {
            font-size: 1.25rem;
            max-width: 800px;
            margin: 0 auto 2.5rem;
            color: #f1f5f9;
            font-weight: 500;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            padding: 1.25rem 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .cta-btn {
            background-color: #2563eb;
            color: #ffffff;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            padding: 1.1rem 3.25rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            border: none;
            cursor: pointer;
        }

        .cta-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.6);
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: -2.5rem auto 4rem;
            padding: 0 1.5rem;
            position: relative;
            z-index: 2;
        }

        /* Highlights Bar */
        .highlights {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.75rem;
            margin-bottom: 4rem;
        }

        .highlight-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 2.25rem 2rem;
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            border-top: 7px solid #2563eb;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .highlight-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .highlight-icon {
            font-size: 2.8rem;
            margin-bottom: 0.85rem;
            display: inline-block;
        }

        .highlight-card h3 {
            font-family: 'Fredoka', sans-serif;
            color: #0f172a;
            font-size: 1.35rem;
            margin-bottom: 0.75rem;
        }

        .highlight-card p {
            color: var(--text-light);
            font-size: 1.05rem;
        }

        /* Section Styling */
        .section-title {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .section-title h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.7rem;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 0.5rem;
        }

        .section-title p {
            color: #e2e8f0;
            font-size: 1.15rem;
            font-weight: 500;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
        }

        /* Subjects Grid */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.25rem;
            margin-bottom: 4.5rem;
        }

        .subject-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .subject-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .subject-image-banner {
            height: 160px;
            width: 100%;
            background-size: cover;
            background-position: center;
            position: relative;
            filter: saturate(1.2);
        }

        .banner-stem {
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.5)), url('https://images.unsplash.com/photo-1596495577886-d920f1fb7238?auto=format&fit=crop&w=600&q=80');
        }

        .banner-lang {
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.5)), url('https://images.unsplash.com/photo-1516627145497-ae6968895b74?auto=format&fit=crop&w=600&q=80');
        }

        .banner-humanities {
            background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.5)), url('https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=600&q=80');
        }

        .subject-card-content {
            padding: 2.25rem;
        }

        .subject-card h3 {
            font-family: 'Fredoka', sans-serif;
            color: #0f172a;
            font-size: 1.6rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 3px solid #fbbf24;
            padding-bottom: 0.75rem;
        }

        .subject-card ul {
            list-style: none;
        }

        .subject-card li {
            padding: 0.65rem 0;
            color: var(--text-dark);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            font-size: 1.02rem;
            font-weight: 500;
        }

        .subject-card li strong {
            color: #0f172a;
        }

        .subject-card li::before {
            content: "✓";
            color: #2563eb;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Interactive Contact Form Box */
        .contact-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            color: #0f172a;
            border-radius: 28px;
            padding: 4rem 3rem;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
            max-width: 750px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .contact-box h2 {
            font-family: 'Fredoka', sans-serif;
            margin-bottom: 0.5rem;
            font-size: 2.7rem;
            text-align: center;
            color: #0f172a;
        }

        .contact-box p {
            color: var(--text-light);
            text-align: center;
            margin-bottom: 2.25rem;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-family: 'Fredoka', sans-serif;
            margin-bottom: 0.5rem;
            font-size: 1.05rem;
            color: #0f172a;
        }
